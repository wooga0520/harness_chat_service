<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Chat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <h1>회원가입</h1>
        <form id="signup-form">
            <div class="field">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" autocomplete="username" minlength="3" maxlength="50" required>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="4" maxlength="100" required>
            </div>
            <div class="field">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" name="nickname" maxlength="50" required>
            </div>
            <button type="submit" class="btn">가입하기</button>
            <div class="error-text" id="error"></div>
        </form>
        <div class="auth-switch">
            이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a>
        </div>
    </div>
</div>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/signup.js}"></script>
</body>
</html>
