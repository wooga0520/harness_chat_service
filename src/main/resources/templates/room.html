<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅방 - Chat</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="chat-page" id="chat-page" th:attr="data-room-id=${roomId}">
    <div class="chat-header">
        <a class="back-link" th:href="@{/rooms}">&larr; 목록</a>
        <div class="room-title" id="room-title">채팅방</div>
        <button type="button" class="btn secondary" id="member-panel-toggle">멤버</button>
    </div>

    <div class="chat-banner hidden" id="chat-banner">
        <span id="chat-banner-text"></span>
        <div class="banner-actions" id="chat-banner-actions"></div>
    </div>

    <div class="chat-log" id="chat-log"></div>

    <form class="chat-input-bar" id="message-form">
        <input type="text" id="message-input" placeholder="메시지를 입력하세요" autocomplete="off" maxlength="2000">
        <button type="submit" class="btn">전송</button>
    </form>

    <div class="member-panel hidden" id="member-panel">
        <div class="member-panel-header">
            <span>멤버</span>
            <button type="button" id="member-panel-close">&times;</button>
        </div>
        <ul class="member-list" id="member-list"></ul>
        <div class="member-invite">
            <input type="text" id="invite-search-input" placeholder="초대할 사용자 검색" autocomplete="off">
            <ul class="user-search-results hidden" id="invite-search-results"></ul>
        </div>
    </div>
</div>

<script th:src="@{/webjars/sockjs-client/1.5.1/sockjs.min.js}"></script>
<script th:src="@{/webjars/stomp-websocket/2.3.4/stomp.min.js}"></script>
<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/room.js}"></script>
</body>
</html>
