spring:
  application:
    name: chatservice
  datasource:
    url: jdbc:postgresql://localhost:5432/chatservice
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    cache: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:this-is-a-dev-only-secret-key-please-change-in-prod-32bytes+}
  expiration-ms: 86400000
